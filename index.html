<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกมแยกปฏิกิริยา SN1 SN2 E1 E2</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#12303d;--mut:#5b7480;--line:#c9d6dd;--acc:#0b6e8a;--ok:#1b7f4b;--okbg:#dff3e7;--bad:#b3261e;--badbg:#fbe4e1;--grid:#d9e4ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c22;--card:#172830;--ink:#e6f1f5;--mut:#92aab5;--line:#2c434d;--acc:#5cc3e0;--ok:#6fd9a0;--okbg:#17382a;--bad:#ff9a92;--badbg:#40201d;--grid:#1a2d35}}
:root[data-theme="dark"]{--bg:#0f1c22;--card:#172830;--ink:#e6f1f5;--mut:#92aab5;--line:#2c434d;--acc:#5cc3e0;--ok:#6fd9a0;--okbg:#17382a;--bad:#ff9a92;--badbg:#40201d;--grid:#1a2d35}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:800;margin:4px 0 12px}
.bar{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:15px;margin-bottom:10px}
.bar span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
svg.mol{width:100%;height:auto;max-height:190px;display:block;background:var(--bg);border-radius:6px}
svg.mol line,svg.mol polyline{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
svg.mol text{fill:var(--ink);font-weight:800;paint-order:stroke;stroke:var(--bg);stroke-width:6px;font-family:'Sarabun',sans-serif}
.arrow{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.arrow b{font-size:18px}
.arrow i{flex:1;height:2px;background:var(--ink);position:relative}
.arrow i:after{content:"";position:absolute;right:0;top:-4px;border:5px solid transparent;border-left:9px solid var(--ink);border-right:0}
.cond{color:var(--mut);margin:0 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;cursor:pointer;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:12px 8px;font-weight:800;font-size:18px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opts button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc);color:var(--bg)}
.opts button.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opts button.no{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.go{width:100%;margin-top:10px;background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:16px}
.go:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--mut);margin:8px 0 0}
.fb{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:15px}
.fb.ok{background:var(--okbg);color:var(--ink);border-left:5px solid var(--ok)}
.fb.no{background:var(--badbg);color:var(--ink);border-left:5px solid var(--bad)}
.fb strong{display:block;margin-bottom:2px}
.end{text-align:center}.end .big{font-size:48px;font-weight:800;margin:6px 0}
</style>
</head>
<body>
<main>
<h1>เกมแยก SN1 · SN2 · E1 · E2</h1>
<div id="app"></div>
</main>
<script>
// โครงสร้าง: p = เส้นโครงสร้าง (polyline), t = ตัวอักษร [x,y,ข้อความ,ขนาด]
var HEX=[[100,38],[127.7,54],[127.7,86],[100,102],[72.3,86],[72.3,54],[100,38]];
var CH=[[20,86],[60,56],[100,86],[140,56]];
var S={
 me:{p:[],t:[[100,76,"CH₃–Br",28]]},
 p1:{p:[CH.concat([[172,84]])],t:[[190,92,"Br"]]},
 s2:{p:[CH,[[60,56],[60,28]]],t:[[60,18,"Br"]]},
 t3:{p:[[[100,30],[100,75]],[[60,75],[140,75]],[[100,75],[100,100]]],t:[[100,118,"Br"]]},
 c2:{p:[HEX,[[100,38],[100,20]]],t:[[100,12,"Br"]]},
 c3:{p:[HEX,[[100,38],[78,16]],[[100,38],[122,16]]],t:[[70,12,"Br"]]},
 ms:{p:[HEX,[[100,38],[100,20]]],t:[[100,12,"OMs"]]},
 ts:{p:[HEX,[[100,38],[100,20]]],t:[[100,12,"OTs"]]},
 pr:{p:[[[30,86],[70,56],[110,86],[142,66]]],t:[[160,72,"Br"]]}
};
var Q=[
{s:'me',r:'NaCN',c:'DMSO (aprotic)',a:['SN2'],e:'Methyl halide ไม่มีทางเกิดคาร์โบเคชัน และ CN⁻ เป็นนิวคลีโอไฟล์ที่ไม่ใช่เบส จึงเป็น SN2 (inversion)'},
{s:'p1',r:'NaI',c:'acetone (aprotic)',a:['SN2'],e:'1° R-X + นิวคลีโอไฟล์ที่ดีแต่เบสอ่อน (I⁻) ใน aprotic → SN2 อย่างเดียว'},
{s:'p1',r:'t-BuOK',c:'t-BuOH',a:['E2'],e:'1° ที่ใช้เบสใหญ่ t-BuO⁻ เข้าโจมตีคาร์บอนไม่ได้ (steric) จึงดึง H → E2 แบบ Hofmann'},
{s:'p1',r:'NaOEt',c:'EtOH',a:['SN2','E2'],e:'1° + เบสแรงขนาดเล็ก (pKa > 12): SN2 เป็น major และ E2 เป็น minor (ตามผังสรุป)'},
{s:'s2',r:'NaOEt',c:'EtOH, Δ (reflux)',a:['E2'],e:'2° + เบสแรง (pKa > 12) + ความร้อน → E2 (Zaitsev ได้ 2-butene เป็นหลัก)'},
{s:'s2',r:'NaN₃',c:'DMF (aprotic)',a:['SN2'],e:'2° + นิวคลีโอไฟล์ที่ไม่ใช่เบส (N₃⁻) ใน aprotic → SN2 (inversion)'},
{s:'s2',r:'EtOH (ตัวทำละลายเอง)',c:'ไม่มีเบสแรง, Δ',a:['SN1','E1'],e:'2° + ตัวทำละลายเป็นกลาง/เบสอ่อน → SN1 + E1 แข่งกัน'},
{s:'s2',r:'t-BuOK',c:'t-BuOH',a:['E2'],e:'เบสใหญ่และแรง → E2 (ได้ alkene ที่แทนที่น้อยกว่าเป็นหลัก)'},
{s:'t3',r:'NaOH',c:'EtOH, Δ',a:['E2'],e:'3° ไม่เกิด SN2 และมีเบสแรง → E2'},
{s:'t3',r:'H₂O',c:'ไม่มีเบสแรง',a:['SN1','E1'],e:'3° + H₂O (เบสอ่อน) → ผ่านคาร์โบเคชัน SN1 + E1'},
{s:'c3',r:'CH₃OH',c:'ตัวทำละลาย protic',a:['SN1','E1'],e:'3° + ROH เป็นกลาง → SN1 (major) + E1 (minor)'},
{s:'c3',r:'NaOEt',c:'EtOH, Δ',a:['E2'],e:'3° + เบสแรง → E2 เสมอ แม้ตัวทำละลายเป็น protic'},
{s:'c2',r:'NaSPh',c:'DMSO (aprotic)',a:['SN2'],e:'2° + Nu ที่ไม่ใช่เบส (PhS⁻) → SN2 (inversion)'},
{s:'ms',r:'NaOEt',c:'EtOH, reflux',a:['E2'],e:'OMs ทำหน้าที่เป็น leaving group เหมือนเฮไลด์ 2° + เบสแรง + Δ → E2 (ต้อง trans-diaxial)'},
{s:'me',r:'NaOH',c:'H₂O/DMSO',a:['SN2'],e:'Methyl halide ไม่มี β-H และเกะกะน้อยที่สุด จึงเป็น SN2 เสมอ แม้ใช้เบสแรง'},
{s:'me',r:'NaOEt',c:'EtOH',a:['SN2'],e:'Methyl halide → SN2 เสมอ ไม่เกิด E2 เพราะไม่มี β-H'},
{s:'pr',r:'NaN₃',c:'DMF (aprotic)',a:['SN2'],e:'1° + Nu ที่ไม่ใช่เบส (N₃⁻) → SN2 อย่างเดียว'},
{s:'pr',r:'NaSPh',c:'DMSO (aprotic)',a:['SN2'],e:'PhS⁻ เป็นนิวคลีโอไฟล์ที่ดีแต่เบสอ่อน (pKa < 12) → SN2'},
{s:'pr',r:'NaOH',c:'H₂O/EtOH',a:['SN2','E2'],e:'1° + เบสแรง (pKa > 12): SN2 เป็น major, E2 เป็น minor'},
{s:'pr',r:'t-BuOK',c:'t-BuOH',a:['E2'],e:'เบสใหญ่เข้าโจมตีคาร์บอนไม่ได้ → E2 แม้เป็น 1°'},
{s:'p1',r:'NaBr',c:'DMF (aprotic)',a:['SN2'],e:'Br⁻ เป็น Nu ที่ไม่ใช่เบสแรง (pKa < 12) → SN2'},
{s:'p1',r:'NaNH₂',c:'NH₃(l)',a:['SN2','E2'],e:'NH₂⁻ เป็นเบสแรง (pKa > 12): 1° ได้ SN2 (major) + E2 (minor)'},
{s:'s2',r:'NaOH',c:'EtOH, Δ',a:['E2'],e:'2° + เบสแรง + ความร้อน → E2'},
{s:'s2',r:'NaCN',c:'DMSO (aprotic)',a:['SN2'],e:'2° + Nu ที่ไม่ใช่เบส (CN⁻) → SN2 (inversion)'},
{s:'s2',r:'NaOMe',c:'MeOH, Δ',a:['E2'],e:'MeO⁻ เป็นเบสแรง (pKa > 12) กับ 2° → E2'},
{s:'s2',r:'H₂O (ตัวทำละลายเอง)',c:'ไม่มีเบสแรง',a:['SN1','E1'],e:'2° + Nu เป็นกลาง/เบสอ่อน → SN1 + E1'},
{s:'s2',r:'NaNH₂',c:'NH₃(l)',a:['E2'],e:'NH₂⁻ เป็นเบสแรงมาก → E2'},
{s:'t3',r:'NaOMe',c:'MeOH, Δ',a:['E2'],e:'3° ไม่เกิด SN2 และมีเบสแรง → E2'},
{s:'t3',r:'EtOH (ตัวทำละลายเอง)',c:'Δ',a:['SN1','E1'],e:'3° + ROH เป็นกลาง → คาร์โบเคชัน SN1 + E1 (ความร้อนเอื้อ E1)'},
{s:'t3',r:'t-BuOK',c:'t-BuOH',a:['E2'],e:'3° + เบสแรงและใหญ่ → E2'},
{s:'t3',r:'NaNH₂',c:'NH₃(l)',a:['E2'],e:'3° + เบสแรง → E2'},
{s:'c3',r:'H₂O',c:'ตัวทำละลาย protic',a:['SN1','E1'],e:'3° + H₂O → SN1 (major) + E1 (minor)'},
{s:'c3',r:'NaOH',c:'EtOH, Δ',a:['E2'],e:'3° + เบสแรง → E2'},
{s:'c2',r:'NaOEt',c:'EtOH, Δ',a:['E2'],e:'2° + เบสแรง + Δ → E2 (ต้อง H axial ตรงข้าม Br)'},
{s:'c2',r:'NaN₃',c:'DMF (aprotic)',a:['SN2'],e:'2° + Nu ที่ไม่ใช่เบส → SN2 (inversion)'},
{s:'c2',r:'NaI',c:'acetone (aprotic)',a:['SN2'],e:'I⁻ เป็น Nu ที่ดีแต่เบสอ่อน → SN2'},
{s:'ms',r:'NaCN',c:'DMSO (aprotic)',a:['SN2'],e:'OMs เป็น leaving group ที่ดี 2° + CN⁻ (ไม่ใช่เบส) → SN2 แบบ inversion'},
{s:'ms',r:'NaN₃',c:'DMF (aprotic)',a:['SN2'],e:'2° sulfonate + Nu ที่ไม่ใช่เบส → SN2 (inversion)'},
{s:'ts',r:'NaOEt',c:'EtOH, reflux',a:['E2'],e:'OTs เหมือน OMs: 2° + เบสแรง + Δ → E2'},
{s:'ts',r:'NaI',c:'acetone (aprotic)',a:['SN2'],e:'OTs เป็น leaving group ที่ดี + I⁻ → SN2'}
];
var M=['SN1','SN2','E1','E2'],N=15;
var st,app=document.getElementById('app');
function best(){try{return +localStorage.getItem('snbest')||0}catch(e){return 0}}
function save(v){try{localStorage.setItem('snbest',v)}catch(e){}}
function svg(k){var d=S[k],h='<svg class="mol" viewBox="0 0 200 130" role="img" aria-label="สารตั้งต้น">';
 d.p.forEach(function(l){h+='<polyline points="'+l.map(function(p){return p.join(',')}).join(' ')+'"/>'});
 d.t.forEach(function(t){h+='<text x="'+t[0]+'" y="'+t[1]+'" text-anchor="middle" font-size="'+(t[3]||18)+'">'+t[2]+'</text>'});
 return h+'</svg>'}
function start(){var idx=Q.map(function(_,i){return i}).sort(function(){return Math.random()-.5}).slice(0,N);
 st={o:idx,i:0,sc:0,sk:0,sel:[],done:false,right:0};draw()}
function bar(){return '<div class="bar"><span>ข้อ '+(st.i+1)+'/'+N+'</span><span>คะแนน '+st.sc+'</span><span>ติดต่อกัน '+st.sk+'</span></div>'}
function draw(){
 if(st.i>=N){var b=Math.max(best(),st.sc);save(b);
  app.innerHTML='<div class="card end"><div>ผลของคุณ</div><div class="big">'+st.sc+' / '+N*10+'</div><p>ตอบถูก '+st.right+' จาก '+N+' ข้อ · คะแนนสูงสุด '+b+'</p><button class="go" id="again">เล่นอีกรอบ</button></div>';
  document.getElementById('again').onclick=start;return}
 var q=Q[st.o[st.i]];
 var h=bar()+'<div class="card">'+svg(q.s)+'<div class="arrow"><i></i></div><b style="font-size:18px">'+q.r+'</b><p class="cond">'+q.c+'</p><div class="opts">';
 M.forEach(function(m){var c='',p=st.sel.indexOf(m)>-1;
  if(st.done){if(q.a.indexOf(m)>-1)c='ok';else if(p)c='no'}
  h+='<button class="'+c+'" data-m="'+m+'" aria-pressed="'+p+'"'+(st.done?' disabled':'')+'>'+m.replace('N','<sub>N</sub>')+'</button>'});
 h+='</div>';
 if(!st.done)h+='<p class="hint">เลือกได้มากกว่า 1 ข้อ เมื่อมีทั้ง major และ minor หรือแข่งกัน (เช่น SN1 + E1)</p><button class="go" id="chk"'+(st.sel.length?'':' disabled')+'>ตรวจคำตอบ</button>';
 else{var ok=st.ok;h+='<div class="fb '+(ok?'ok':'no')+'"><strong>'+(ok?'ถูกต้อง! +10':'คำตอบที่ถูกคือ '+q.a.join(' + '))+'</strong>'+q.e+'</div><button class="go" id="nx">'+(st.i==N-1?'ดูผลรวม':'ข้อต่อไป')+'</button>'}
 app.innerHTML=h+'</div>';
 app.querySelectorAll('.opts button').forEach(function(b){b.onclick=function(){if(st.done)return;var m=b.dataset.m,k=st.sel.indexOf(m);if(k>-1)st.sel.splice(k,1);else st.sel.push(m);draw()}});
 var c=document.getElementById('chk');if(c)c.onclick=function(){
  var ok=q.a.length==st.sel.length&&q.a.every(function(x){return st.sel.indexOf(x)>-1});
  st.ok=ok;st.done=true;if(ok){st.sc+=10;st.sk++;st.right++}else st.sk=0;draw()};
 var n=document.getElementById('nx');if(n)n.onclick=function(){st.i++;st.sel=[];st.done=false;draw()};
}
start();
</script>
</body>
</html>
